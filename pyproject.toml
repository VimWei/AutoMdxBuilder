[project]
name = "automdxbuilder"
version = "1.6"
description = "Automatically make mdx dictionaries (long-term maintained source fork)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "colorama",
    "tomli",
    "tomlkit",
    "mdict-utils",
    "OpenCC",
    "Pillow",
    "PyMuPDF",
    "pywinauto",
    "pywin32; sys_platform == 'win32'",
    "pywin32-ctypes; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

# 这是脚本目录，不是可安装包：不要让 uv 构建/安装本项目。
[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["tools", "_tmp"]

[tool.ruff.lint]
# 采用 ruff 默认规则集。
# 源码中的中文全角标点属于正常文案内容，不使用 RUF001/RUF002/RUF003
# （这三个规则不在默认集中，无需显式关闭）。

